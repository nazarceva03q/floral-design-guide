<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#520c20">
  <meta name="description" content="Найдите настроение вашего цветочного сайта: простой тест, десять стилей и примеры для вдохновения.">
  <title>Подберём идеальный дизайн вашего сайта</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <header class="header wrap">
    <a class="brand" href="#" aria-label="На главную"><img src="rose-bouquet.svg" width="72" height="86" alt="Букет роз"></a>
    <nav aria-label="Основная навигация"><button type="button" data-action="catalog" class="nav-link">Все стили</button><button type="button" data-action="selection" class="nav-link selection-nav">Мой выбор <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.9a5.3 5.3 0 0 0-7.5 0L12 6.2l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.6a5.3 5.3 0 0 0 0-7.5Z"/></svg></button></nav>
  </header>
  <main id="main" class="wrap" tabindex="-1"><div class="loading">Готовим примеры…</div></main>
  <noscript><p class="wrap">Для теста и выбора примеров включите JavaScript в браузере. Ответы не отправляются на сервер.</p></noscript>
  <footer class="footer wrap"><img class="footer-roses" src="rose-bouquet.svg" width="72" height="86" alt="Букет роз"><div><button type="button" class="text-button" data-action="privacy">О ваших ответах</button><button type="button" class="text-button" data-action="clear">Очистить мои ответы и выбор</button></div></footer>
  <aside id="selection-bar" class="selection-bar" hidden aria-label="Выбранные сайты"><span id="bar-count"></span><button type="button" class="button small" data-action="selection">Посмотреть выбор</button></aside>
  <dialog id="image-dialog" class="image-dialog" aria-labelledby="image-title"><div class="dialog-top"><p id="image-title"></p><button type="button" class="icon-button" data-action="close-image" aria-label="Закрыть изображение">×</button></div><div class="gallery-stage"><img id="large-image" alt=""><button type="button" class="gallery-arrow previous" data-action="prev-image" aria-label="Предыдущее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><button type="button" class="gallery-arrow next" data-action="next-image" aria-label="Следующее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button><button type="button" class="heart-button photo-heart" id="gallery-photo-heart" data-photo-pick="elegant:0" aria-label="Добавить фото в избранное" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.9a5.3 5.3 0 0 0-7.5 0L12 6.2l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.6a5.3 5.3 0 0 0 0-7.5Z"/></svg></button></div><div class="image-bottom"><span id="image-counter"></span></div><p class="caption">Добавьте понравившийся пример сердечком в «Мой выбор». Напишите нам в чате, какие детали вам нравятся.</p></dialog>
  <dialog id="choice-dialog" class="choice-dialog" aria-labelledby="choice-title"><div class="dialog-top"><h2 id="choice-title">Ваш выбор</h2><button type="button" class="icon-button" data-action="close-selection" aria-label="Закрыть выбор">×</button></div><div id="choice-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
